<!-- GROUPES WHATSAPP STYLE -->
<div class="modal" id="mGroups"><div class="m-header"><span onclick="closeAll()">‹</span><b>💬 Groupes Mboka</b><span style="margin-left:auto" onclick="createGroup()">+ Nouveau</span></div><div class="box">
<div class="search"><span>🔍</span><input placeholder="Chercher groupe..."></div>
<div id="groupsList"></div>
</div></div>

<div class="modal" id="mChat"><div class="m-header"><span onclick="openGroups()">‹</span><b id="chatGroupName">Groupe</b><span style="margin-left:auto">📹</span></div>
<div id="chatMessages" style="padding:16px;height:calc(100vh - 140px);overflow-y:auto;display:flex;flex-direction:column;gap:10px;background:linear-gradient(180deg,rgba(255,255,255,0.7),rgba(245,245,245,0.8));backdrop-filter:blur(20px)"></div>
<div style="position:fixed;bottom:0;width:100%;max-width:480px;background:rgba(255,255,255,0.8);backdrop-filter:blur(30px);border-top:1px solid rgba(0,0,0,0.08);padding:10px;display:flex;gap:8px;align-items:center">
<button onclick="startAudioComment()" id="audioBtn" style="width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#FFD700,#FFE55C);font-size:18px">🎙️</button>
<input class="input" id="chatInput" placeholder="Message..." style="flex:1;margin:0;background:rgba(255,255,255,0.9);border-radius:100px">
<button class="btn btn-gold" style="width:44px;height:44px;border-radius:50%;margin:0;padding:0" onclick="sendGroupMessage()">➤</button>
</div>
</div>
