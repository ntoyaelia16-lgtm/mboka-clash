<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MBOKA STREAM - Live Kin</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0066FF">
<style>
:root{--blue:#0066FF;--red:#FF0033;--black:#000;--card:#111}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:#000;color:#fff;padding-bottom:80px}
.header{position:sticky;top:0;z-index:99;background:rgba(0,0,0,0.9);border-bottom:2px solid var(--blue);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px} .logo b{color:var(--blue)} .logo span{color:var(--red)}
.coin{background:#111;border:1px solid var(--blue);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #222;position:relative}
.thumb{width:100%;height:220px;background:#000}
.thumb img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--red);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:900}
.view{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:6px;font-size:10px}
.info{padding:10px} .info b{font-size:13px} .info small{color:#888;display:block;font-size:11px}
.btn{width:100%;background:var(--blue);border:none;color:#fff;padding:8px;border-radius:20px;font-weight:800;margin-top:6px}
.go{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:var(--red);border:none;color:#fff;padding:16px 32px;border-radius:30px;font-weight:900;font-size:16px;box-shadow:0 8px 30px rgba(255,0,51,0.6);z-index:90}
.bottom{position:fixed;bottom:0;width:100%;background:#0A0A0A;border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav{color:#555;text-align:center;font-size:11px} .nav.on{color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.95);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex}
.box{background:#111;border:1px solid var(--blue);border-radius:20px;padding:20px;width:100%;max-width:360px}
.input{width:100%;background:#000;border:1px solid #333;padding:14px;border-radius:10px;color:#fff;margin:8px 0}
#liveVideo{width:100%;height:300px;background:#000;border-radius:12px;object-fit:cover}
</style>
</head>
<body>
<div class="header">
<div class="logo"><b>MBOKA</b> <span>STREAM</span></div>
<div class="coin">💰 <span id="fc">0</span> FC</div>
</div>

<div style="padding:10px 16px;display:flex;gap:8px;overflow-x:auto">
<button style="background:var(--red);color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800">🔴 LIVE</button>
<button style="background:#111;border:1px solid #222;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px">⚔️ CLASH</button>
<button style="background:#111;border:1px solid #222;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px">🎤 BATTLE</button>
</div>

<div class="grid" id="grid"></div>
<button class="go" onclick="openLive()">🔴 GO LIVE</button>

<div class="bottom">
<div class="nav on">🏠<br>Accueil</div>
<div class="nav" onclick="showWallet()">💰<br>Wallet</div>
<div class="nav" onclick="location.href='admin.html'">⚙️<br>Admin</div>
<div class="nav">👤<br>Profil</div>
</div>

<div class="modal" id="mLive">
<div class="box">
<h3>🔴 Lancer ton CLASH</h3>
<input class="input" id="title" placeholder="Titre: Ball vs Cc Ngaba">
<video id="liveVideo" autoplay muted playsinline></video>
<button class="input" style="background:var(--red);font-weight:900;border:none" onclick="startLive()">🚀 COMMENCER LIVE</button>
<button class="input" style="background:#222" onclick="closeAll()">Annuler</button>
</div>
</div>

<div class="modal" id="mWatch">
<div class="box">
<div style="display:flex;justify-content:space-between"><b id="wName">Live</b><button onclick="closeAll()" style="background:#222;border:none;color:#fff;padding:6px 12px;border-radius:20px">✕</button></div>
<div style="width:100%;height:300px;background:#000;border-radius:12px;margin:10px 0;display:flex;align-items:center;justify-content:center">🔴 LIVE EN COURS</div>
<button class="input" style="background:var(--red);font-weight:900" onclick="doSub()">💎 S'ABONNER 5000 FC</button>
<button class="input" style="background:#222" onclick="closeAll()">Fermer</button>
</div>
</div>

<script>
let me=JSON.parse(localStorage.getItem('mboka_me')||'null');
if(!me){me={name:'Kinois_'+Math.floor(Math.random()*9000),fc:0,subs:0};localStorage.setItem('mboka_me',JSON.stringify(me))}
document.getElementById('fc').innerText=me.fc;
let stream=null;
const lives=[
{name:'Ball le Boss',title:'CLASH Ngaba ce soir!',v:342},
{name:'Cc Officiel',title:'Freestyle live',v:128},
{name:'Hfui Music',title:'Qui est le plus fort?',v:89},
{name:'Mama Kin',title:'Debat + cuisine',v:256}
];
function render(){
document.getElementById('grid').innerHTML=lives.map((l,i)=>`
<div class="card" onclick="watchLive('${l.name}')">
<div class="badge">🔴 LIVE</div><div class="view">👁 ${l.v}</div>
<div class="thumb"><img src="https://picsum.photos/400/600?random=${i+10}"></div>
<div class="info"><b>${l.name}</b><small>${l.title}</small><button class="btn">REGARDER</button></div>
</div>`).join('');
}
render();
async function openLive(){
document.getElementById('mLive').classList.add('on');
try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});document.getElementById('liveVideo').srcObject=stream;}catch(e){alert('Camera bloquée: autorise la caméra')}
}
function startLive(){
let t=document.getElementById('title').value||'CLASH LIVE MBOKA';
lives.unshift({name:me.name,title:t,v:1});render();closeAll();
alert('🔴 LIVE LANCÉ: '+t+'\nTout Kin voit ton live! Tu gagnes 70% des abonnements');
}
function watchLive(n){document.getElementById('wName').innerText=n;document.getElementById('mWatch').classList.add('on');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'));if(stream){stream.getTracks().forEach(t=>t.stop())}}
function doSub(){
me.fc+=1500;me.subs++;localStorage.setItem('mboka_me',JSON.stringify(me));
document.getElementById('fc').innerText=me.fc;
alert('💰 Merci! 5000 FC payé\n3500 FC -> createur\n1500 FC -> TOI!\n\nGains: '+me.fc+' FC');
closeAll();
}
function showWallet(){alert('💰 WALLET MBOKA\n\nGains: '+me.fc+' FC\nAbonnés: '+me.subs+'\n\nRetrait: va dans admin.html -> configure ton Airtel Money')}
</script>
</body>
</html>
