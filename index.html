<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MBOKA STREAM - Live Kin</title>
<link rel="manifest" href="manifest.json">
<script src="https://download.agora.io/sdk/release/AgoraRTC_N-4.20.2.js"></script>
<style>
:root{--blue:#0066FF;--red:#FF0033;--black:#000;--card:#111;--dark:#0A0A0A}
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}
body{background:var(--black);color:#fff;padding-bottom:70px}
.header{position:sticky;top:0;z-index:100;background:rgba(0,0,0,0.9);backdrop-filter:blur(10px);border-bottom:2px solid var(--blue);padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:900;font-size:22px;letter-spacing:-1px} .logo b{color:var(--blue)} .logo span{color:var(--red)}
.coin{background:var(--card);border:1px solid var(--blue);padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700}
.live-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px}
.live-card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid #222;position:relative}
.live-card .thumb{width:100%;height:220px;background:#000;position:relative}
.live-card img, .live-card video{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;top:8px;left:8px;background:var(--red);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:900;z-index:2}
.viewers{position:absolute;top:8px;right:8px;background:rgba(0,0,0,0.7);padding:3px 8px;border-radius:6px;font-size:10px;z-index:2}
.info{padding:10px} .info b{font-size:13px} .info small{color:#888;font-size:11px;display:block;margin:2px 0}
.btn-sub{width:100%;background:var(--blue);border:none;color:white;padding:8px;border-radius:20px;font-weight:800;margin-top:6px;font-size:12px}
.btn-go{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--red);border:none;color:white;padding:16px 32px;border-radius:30px;font-weight:900;font-size:16px;box-shadow:0 8px 30px rgba(255,0,51,0.5);z-index:90}
.bottom{position:fixed;bottom:0;width:100%;background:var(--dark);border-top:1px solid #222;display:flex;justify-content:space-around;padding:10px 0;z-index:100}
.nav{color:#555;text-align:center;font-size:11px} .nav.active{color:var(--blue)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.on{display:flex} .box{background:#111;border:1px solid var(--blue);border-radius:20px;padding:20px;width:100%;max-width:360px}
.input{width:100%;background:#000;border:1px solid #333;padding:14px;border-radius:10px;color:white;margin:8px 0}
#remote-player{width:100%;height:60vh;background:#000;border-radius:16px}
</style>
</head>
<body>
<div class="header">
<div class="logo"><b>MBOKA</b> <span>STREAM</span></div>
<div class="coin" id="wallet">💰 <span id="myFC">0</span> FC</div>
</div>

<div style="padding:10px 16px;display:flex;gap:8px;overflow-x:auto">
<button style="background:var(--red);color:#fff;border:none;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:800">🔴 LIVE</button>
<button style="background:#111;border:1px solid #222;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px">⚔️ CLASH</button>
<button style="background:#111;border:1px solid #222;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px">🎤 BATTLE</button>
</div>

<div class="live-grid" id="grid"></div>

<button class="btn-go" onclick="openGoLive()">🔴 GO LIVE</button>

<div class="bottom">
<div class="nav active">🏠<br>Accueil</div>
<div class="nav" onclick="openWallet()">💰<br>Wallet</div>
<div class="nav" onclick="location.href='admin.html'">⚙️<br>Admin</div>
<div class="nav">👤<br>Profil</div>
</div>

<!-- MODAL GO LIVE -->
<div class="modal" id="mLive">
<div class="box">
<h3>🔴 Lancer ton CLASH LIVE</h3>
<input class="input" id="liveTitle" placeholder="Titre: Ball vs Cc - Ngaba">
<div id="preview" style="width:100%;height:220px;background:#000;border-radius:12px;margin:8px 0;overflow:hidden"></div>
<button class="input" style="background:var(--red);font-weight:900;border:none" onclick="startRealLive()">🚀 COMMENCER LIVE</button>
<button class="input" style="background:#222" onclick="closeAll()">Annuler</button>
<small style="color:#666;font-size:10px">Ton live sera vu par tous. Tu gagnes 70% des abonnements.</small>
</div>
</div>

<!-- MODAL REGARDER -->
<div class="modal" id="mWatch">
<div class="box" style="max-width:420px">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
<b id="watchName">Live</b><button onclick="leaveLive()" style="background:#222;border:none;color:#fff;padding:6px 12px;border-radius:20px">✕</button>
</div>
<div id="remote-player"></div>
<div style="margin-top:10px;display:flex;gap:8px">
<button class="btn-sub" style="flex:1;background:var(--red)" onclick="openSub()">💎 S'ABONNER 5000 FC</button>
<button class="btn-sub" style="flex:1;background:#222" onclick="sendGift()">🎁 Cadeau</button>
</div>
<div id="chat" style="height:100px;overflow-y:auto;background:#000;border-radius:8px;padding:8px;margin-top:8px;font-size:12px;color:#888">Chat live...</div>
</div>
</div>

<!-- MODAL ABONNEMENT -->
<div class="modal" id="mSub">
<div class="box">
<h3 style="color:var(--blue)">💎 S'abonner</h3>
<p style="font-size:12px;color:#888">5000 FC / mois - Supporte le créateur de Kin!</p>
<div style="background:#000;padding:12px;border-radius:10px;margin:12px 0;border:1px solid #222">
<div style="display:flex;justify-content:space-between"><span>Pour créateur</span><b style="color:#00FF66">3500 FC</b></div>
<div style="display:flex;justify-content:space-between"><span>Pour MBOKA (toi)</span><b style="color:var(--blue)">1500 FC</b></div>
</div>
<button class="input" style="background:#FF5500;color:#fff;font-weight:900" onclick="doPay('Orange Money')">🟠 Orange Money</button>
<button class="input" style="background:#FF0000;color:#fff;font-weight:900" onclick="doPay('Airtel Money')">🔴 Airtel Money</button>
<button class="input" style="background:#0055FF;color:#fff" onclick="doPay('M-Pesa')">🔵 M-Pesa</button>
<button onclick="closeAll()" style="background:none;border:none;color:#666;width:100%">Fermer</button>
</div>
</div>

<script>
// CONFIG - REMPLACE PAR TES VRAIES CLES PLUS TARD
const AGORA_APP_ID = "a0f8c1b2d3e4f5a6b7c8d9e0f1a2b3c4"; // Va sur agora.io pour avoir le tien gratuit
let client, localVideo, isLive=false;
let users = JSON.parse(localStorage.getItem('mboka_users')||'[]');
let me = JSON.parse(localStorage.getItem('mboka_current')||'null');
if(!me){me={id:'U'+Date.now(),name:'Kinois_'+Math.floor(Math.random()*9000),earnings:0,subs:0,join:new Date().toISOString(),ip:'Kinshasa'};users.push(me);localStorage.setItem('mboka_users',JSON.stringify(users));localStorage.setItem('mboka_current',JSON.stringify(me))}
document.getElementById('myFC').innerText=me.earnings;

// FAUX LIVES POUR DESIGN + VRAI LIVE QUAND QUELQU'UN LANCE
const lives=[{name:'Ball le Boss',title:'CLASH Ngaba ce soir!',viewers:342},{name:'Cc Officiel',title:'Freestyle live',viewers:128},{name:'Hfui Music',title:'Qui est le plus fort?',viewers:89},{name:'Mama Kin',title:'Débat + cuisine',viewers:256}];
function render(){document.getElementById('grid').innerHTML=lives.map((l,i)=>`
<div class="live-card" onclick="watchLive('${l.name}',${i})">
<div class="badge">🔴 LIVE</div><div class="viewers">👁 ${l.viewers}</div>
<div class="thumb"><img src="https://picsum.photos/400/600?random=${i+10}"></div>
<div class="info"><b>${l.name}</b><small>${l.title}</small><button class="btn-sub">REGARDER</button></div>
</div>`).join('');}
render();

function openGoLive(){document.getElementById('mLive').classList.add('on'); initCamera();}
async function initCamera(){try{localVideo=await AgoraRTC.createCameraVideoTrack(); localVideo.play('preview');}catch(e){console.log(e)}}
async function startRealLive(){
let title=document.getElementById('liveTitle').value||'CLASH LIVE MBOKA';
try{
// Si tu as pas encore de clé Agora, ça lance en mode démo locale
if(AGORA_APP_ID.includes('a0f8c1')){
alert('MODE DEMO: Ton live est lancé localement!\\n\\nPour vrai streaming mondial:\\n1. Va sur agora.io -> Créer projet gratuit\\n2. Copie ton App ID\\n3. Remplace AGORA_APP_ID dans le code');
}else{
client=AgoraRTC.createClient({mode:'live',codec:'vp8'});
await client.setClientRole('host');
await client.join(AGORA_APP_ID, 'mboka-main', null, me.id);
await client.publish(localVideo);
}
isLive=true; closeAll(); lives.unshift({name:me.name,title:title,viewers:1}); render();
alert('🔴 LIVE LANCE: '+title+'\\nTout Kinshasa peut te voir!');
}catch(e){alert('Erreur caméra: '+e.message)}
}

function watchLive(name,idx){
document.getElementById('watchName').innerText=name+' - LIVE';
document.getElementById('mWatch').classList.add('on');
// Si c'est le live de l'utilisateur local, on montre sa preview, sinon Agora remote
if(client && isLive && idx===0){localVideo.play('remote-player');}
document.getElementById('chat').innerHTML+='<br>🔵 Tu as rejoint le live';
}
async function leaveLive(){
document.getElementById('mWatch').classList.remove('on');
if(client){await client.leave();} 
}
function openSub(){document.getElementById('mSub').classList.add('on');}
function closeAll(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('on'));}

function doPay(method){
alert('💰 Paiement '+method+' - 5000 FC\\n\\nEn mode réel avec CinetPay:\\n- 3500 FC -> créateur\\n- 1500 FC -> TON Airtel Money\\n\\nPour activer: crée compte sur cinetpay.com et colle ta clé API dans admin.html');
me.earnings+=1500; me.subs++; localStorage.setItem('mboka_current',JSON.stringify(me));
document.getElementById('myFC').innerText=me.earnings;
closeAll();
}
function openWallet(){let m=JSON.parse(localStorage.getItem('mboka_current')); alert('💰 WALLET MBOKA\\n\\nGains: '+m.earnings+' FC\\nAbonnés: '+(m.subs||0)+'\\n\\nRetrait: va dans admin.html -> config ton numéro Airtel Money');}
function sendGift(){alert('🎁 Cadeau envoyé! 1000 FC - Le streameur reçoit 700 FC, toi 300 FC'); me.earnings+=300; document.getElementById('myFC').innerText=me.earnings; localStorage.setItem('mboka_current',JSON.stringify(me));}
</script>
</body>
</html>
